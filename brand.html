<title>LAGO 로그인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: split screen — navy brand panel with ONE 3D symbol that flies in on load and rests bottom-right behind the copy; quiet form on the right; login plays a full-screen 3D intro */
:root{
  --navy:#0B1F55; --deep:#071640; --blue:#1B3E9E; --sky:#5B8CFF; --mist:#EDF2FF;
  --bg:#FFFFFF; --fg:#111A33; --muted:#5A6580; --line:#DCE3F2; --field:#F6F8FD;
  --font:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1430;--fg:#E8EDFB;--muted:#9AA6C4;--line:#24305A;--field:#111C40;--mist:#16224A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1430;--fg:#E8EDFB;--muted:#9AA6C4;--line:#24305A;--field:#111C40;--mist:#16224A;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px}
.login{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100%}
.brand{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 85% 10%,#1B3E9E 0%,#0B1F55 55%,#071640 100%);
  padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;gap:22px;min-height:560px}
.brand canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.anim{position:absolute!important;right:calc(16px + env(safe-area-inset-right,0px));bottom:16px;z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;max-width:calc(100% - 32px)}
.anim .seg{display:flex;gap:2px;padding:3px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.anim .seg button{background:none;border:0;color:#C7D6FF;border-radius:16px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.anim .seg button[aria-pressed="true"]{background:#fff;color:#0B1F55;font-weight:600}
.replay{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.replay:hover,.anim .seg button:hover{background:rgba(255,255,255,.18)}
.anim .seg button[aria-pressed="true"]:hover{background:#fff}
.anim button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.brand > :not(canvas){position:relative}
.brand h1{font-size:clamp(30px,3.4vw,44px);line-height:1.25;font-weight:700;margin:56px 0 0;text-wrap:balance}
.brand p.sub{margin:0;color:#C7D6FF;font-size:16px}
.modes{display:grid;gap:10px;margin:8px 0 0;padding:0;list-style:none}
.modes li{display:flex;gap:12px;align-items:baseline}
.modes b{font-weight:700;letter-spacing:.04em;min-width:64px}
.modes span{color:#AFC4F5;font-size:14px}
.formside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.formside small{color:var(--muted);font-size:12px}
form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
form h2{margin:0;font-size:28px;font-weight:700;color:var(--fg)}
form .lead{margin:0 0 8px;color:var(--muted)}
.btn{font:inherit;font-size:15px;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn:hover{border-color:var(--sky)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btn.primary{background:linear-gradient(90deg,var(--blue),var(--sky));color:#fff;border:0;font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
input{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:12px;padding:12px 14px}
.links{display:flex;justify-content:center;gap:10px;font-size:13px}
.links a{color:var(--sky);text-decoration:none;font-weight:500}
.fine{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin:4px 0 0}
.err{color:#D9443B;font-size:12.5px;margin:-6px 0 0;min-height:1em}
.ok{margin:0;padding:10px 12px;border-radius:10px;background:var(--mist);color:var(--fg);font-size:13px;text-align:center}
/* intro */
.intro{position:fixed;inset:0;background:radial-gradient(90% 80% at 50% 40%,#13306F 0%,#0A1A4A 55%,#050D29 100%);z-index:20;display:flex;align-items:center;justify-content:center}
.intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro .over{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:38vh;text-align:center;padding-inline:16px}
.intro .wm{opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
.intro .tag{color:#B9CCFF;opacity:0;transition:opacity .8s ease .25s;margin:0;font-size:15px}
.intro .go{opacity:0;pointer-events:none;transition:opacity .6s ease .5s;display:flex;gap:10px;margin-top:10px}
.intro.done .wm{opacity:1;transform:none}.intro.done .tag{opacity:1}.intro.done .go{opacity:1;pointer-events:auto}
.intro .go .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.25)}
.intro .go .btn.primary{background:#fff;color:#0B1F55}
.skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));background:none;border:1px solid rgba(255,255,255,.25);color:#C7D6FF;border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
@media (max-width:760px){
  .login{grid-template-columns:1fr}
  .brand{min-height:340px;padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:14px}
  .brand h1{margin-top:20px;font-size:28px}
  .modes{display:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="word" viewBox="0 0 180 56"><g fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6V50H36"/><path d="M42 50L60 6L78 50"/><path d="M124.9 13.9A22 22 0 1 0 130 28H104"/><circle cx="150" cy="28" r="22"/></g></symbol>
  </defs>
</svg>

<main class="login" id="login">
  <section class="brand" aria-label="LAGO 소개">
    <canvas id="bc" aria-hidden="true"></canvas>
    <svg width="104" height="32" viewBox="0 0 180 56" style="color:#fff" role="img" aria-label="LAGO"><use href="#word"/></svg>
    <div class="anim" role="group" aria-label="로고 애니메이션 고르기">
    <div class="seg" id="modes">
      <button type="button" data-m="0" aria-pressed="true">소용돌이</button>
      <button type="button" data-m="1" aria-pressed="false">물결</button>
      <button type="button" data-m="2" aria-pressed="false">궤도</button>
    </div>
    <button type="button" class="replay" id="replay"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>다시 보기</button>
    </div>
    <h1>찾고 알려주는<br>사실적인 AI</h1>
    <p class="sub">데이터를 찾고, 첨가 없이 알려 줘요.</p>
    <ul class="modes">
      <li><b>FACT</b><span>사실만 빠르고 간편하게</span></li>
      <li><b>THINK</b><span>생각하고 추론</span></li>
      <li><b>CODE</b><span>더 나은 코드</span></li>
    </ul>
  </section>

  <section class="formside">
    <form id="f" novalidate>
      <h2>LAGO에 오신 걸 환영해요</h2>
      <p class="lead">로그인하고 대화를 이어가세요</p>
      <button type="button" class="btn" id="google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.1C12.5 13.5 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        Google로 계속하기
      </button>
      <div class="or">또는</div>
      <label for="email">이메일<input id="email" type="email" placeholder="you@example.com" value="dani@example.com" autocomplete="email"></label>
      <label for="pw">비밀번호<input id="pw" type="password" placeholder="8자 이상" value="lago2026" autocomplete="current-password"></label>
      <p class="err" id="err" aria-live="polite"></p>
      <button type="submit" class="btn primary">이메일로 로그인</button>
      <div class="links"><a href="#" onclick="return false">비밀번호 찾기</a><span aria-hidden="true">·</span><a href="#" onclick="return false">회원가입</a></div>
      <p class="ok" id="ok" hidden aria-live="polite">로그인했어요. (예시 화면이라 실제로 이동하지는 않아요)</p>
      <p class="fine">예시 화면이에요. 처음 열 때 왼쪽 로고 애니메이션이 재생돼요.<br>가입하면 이용약관과 개인정보 처리방침에 동의하게 돼요. 만 14세 이상만 가입할 수 있어요.</p>
    </form>
    <small>© 2026 LAGO</small>
  </section>
</main>

<section class="intro" id="intro" hidden aria-label="LAGO 입장 애니메이션">
  <canvas id="c"></canvas>
  <button class="skip" id="skip">건너뛰기</button>
  <div class="over">
    <svg class="wm" width="170" height="53" viewBox="0 0 180 56" style="color:#fff" role="img" aria-label="LAGO"><use href="#word"/></svg>
    <p class="tag">다니님, 다시 오신 걸 환영해요</p>
    <div class="go">
      <button class="btn" id="again">다시 보기</button>
      <button class="btn primary" id="back">LAGO 시작하기</button>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const login=$('login'), intro=$('intro');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const easeIO=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function half(upper){
  const s=new THREE.Shape();
  if(upper){s.moveTo(1,0);s.absarc(0,0,1,0,Math.PI,false);}else{s.moveTo(-1,0);s.absarc(0,0,1,Math.PI,Math.PI*2,false);}
  s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:.28,bevelEnabled:true,bevelSize:.035,bevelThickness:.035,bevelSegments:4,curveSegments:72});
  g.translate(0,0,-.14);
  const p=g.attributes.position,col=new Float32Array(p.count*3),a=new THREE.Color('#8FB2FF').convertSRGBToLinear(),b=new THREE.Color('#0B2468').convertSRGBToLinear(),c=new THREE.Color();
  for(let i=0;i<p.count;i++){const x=p.getX(i);const k=upper?(x+1)/2:1-(x+1)/2;c.copy(a).lerp(b,Math.min(1,Math.max(0,k)));col.set([c.r,c.g,c.b],i*3);}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  return new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,metalness:.35,roughness:.28}));
}

// One reusable stage: the two halves spiral in and lock into the mark, then the mark moves to a resting spot given by rest()
function Stage(canvas,host,rest){
  const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  r.setPixelRatio(Math.min(2,devicePixelRatio));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,100);cam.position.z=7.5;
  scene.add(new THREE.AmbientLight(0x9fb6ff,.55));
  const key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(3,4,6);scene.add(key);
  const rim=new THREE.DirectionalLight(0x6f9bff,.9);rim.position.set(-5,-2,-3);scene.add(rim);
  const sweep=new THREE.PointLight(0xffffff,0,9);scene.add(sweep);
  const group=new THREE.Group(),R=half(true),L=half(false);group.add(L,R);scene.add(group);
  let vw=1,vh=1,raf=0,t0=0,onDone=null,done=false;
  function size(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
    vh=2*cam.position.z*Math.tan(THREE.MathUtils.degToRad(cam.fov/2));vw=vh*cam.aspect;}
  let mode=0;
  const cl=x=>x<0?0:x>1?1:x;
  const back=x=>{x=cl(x);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
  function pose(t){
    const s=ease((t-2.4)/1.2);let gy=0,gx=0,gz=0;
    if(mode===0){
      const a=easeIO(t/2.6),ang=(1-a)*Math.PI*2.2,rad=(1-a)*5.5;
      R.position.set(1+Math.cos(ang)*rad,Math.sin(ang)*rad*.6,-(1-a)*6);
      L.position.set(-1-Math.cos(ang)*rad,-Math.sin(ang)*rad*.6,-(1-a)*6);
      R.rotation.set((1-a)*2.4,(1-a)*-3.1,(1-a)*1.2);L.rotation.set((1-a)*-2.4,(1-a)*3.1,(1-a)*1.2);
      gy=(1-ease((t-1.6)/2.2))*-Math.PI;
    }else if(mode===1){
      const eR=back((t-.2)/2.2),eL=back((t-.55)/2.2),w=1-cl(t/2.8);
      R.position.set(1,(1-eR)*-4.8,(1-eR)*-1.5);L.position.set(-1,(1-eL)*4.8,(1-eL)*-1.5);
      R.rotation.set((1-eR)*-Math.PI/2,0,Math.sin(t*5)*.28*w);L.rotation.set((1-eL)*Math.PI/2,0,-Math.sin(t*5+1)*.28*w);
      gz=Math.sin(t*1.6)*.04;gx=-.25*(1-cl(t/2.6));
    }else{
      const e=easeIO(t/2.8),ang=(1-e)*Math.PI*4,rad=(1-e)*3.2;
      R.position.set(1+Math.cos(ang)*rad,Math.sin(ang*2)*(1-e)*.5,Math.sin(ang)*rad);
      L.position.set(-1-Math.cos(ang)*rad,-Math.sin(ang*2)*(1-e)*.5,-Math.sin(ang)*rad);
      R.rotation.set(0,(1-e)*Math.PI*3,0);L.rotation.set(0,-(1-e)*Math.PI*3,0);
      gx=.55*(1-e);
    }
    const f=rest(vw,vh);
    group.rotation.y=gy+Math.sin(t*.8)*.1*s;
    group.rotation.x=gx+Math.sin(t*.6)*.06*s;group.rotation.z=gz;
    group.position.set(f.x*s,f.y*s,0);group.scale.setScalar(1+(f.s-1)*s);
    const k=(t-2.2)/1.4;sweep.intensity=k>0&&k<1?Math.sin(k*Math.PI)*2.4:0;
    sweep.position.set(group.position.x-3*group.scale.x+6*group.scale.x*Math.min(1,Math.max(0,k)),group.position.y+1,2.2);
  }
  function frame(now){const t=reduce?6:(now-t0)/1000;pose(t);r.render(scene,cam);
    if(!done&&t>3.5){done=true;onDone&&onDone();}raf=requestAnimationFrame(frame);}
  addEventListener('resize',size);
  return{setMode(m){mode=m;},play(cb){size();onDone=cb;done=false;cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(frame);},
         stop(){cancelAnimationFrame(raf);},skip(){t0=performance.now()-6000;}};
}

let brand=null,big=null;
if(window.THREE){
  // brand panel: one mark, resting low and to the right, partly off the edge
  brand=new Stage($('bc'),document.querySelector('.brand'),(vw,vh)=>{
    const s=Math.min(.82*vw/4,.42*vh);
    return{s,x:vw/2-2*s*.78,y:-vh/2+s*1.05};
  });
  big=new Stage($('c'),intro,()=>({s:.82,x:0,y:.55}));
  brand.play();
  document.getElementById('replay').addEventListener('click',()=>brand.play());
  document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    brand.setMode(+b.dataset.m);brand.play();
  }));
}
function play(){
  login.hidden=true;intro.hidden=false;intro.classList.remove('done');
  if(!big){intro.classList.add('done');return;}
  brand&&brand.stop();big.play(()=>intro.classList.add('done'));
  $('again').focus({preventScroll:true});
}
function back(){big&&big.stop();intro.hidden=true;login.hidden=false;brand&&brand.play();}
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const em=$('email').value.trim(),pw=$('pw').value;
  if(!/^\S+@\S+\.\S+$/.test(em)){$('err').textContent='이메일 주소를 확인해 주세요.';$('email').focus();return;}
  if(pw.length<8){$('err').textContent='비밀번호는 8자 이상이에요.';$('pw').focus();return;}
  $('err').textContent='';$('ok').hidden=false;
});
['email','pw'].forEach(id=>$(id).addEventListener('input',()=>$('err').textContent=''));
$('google').addEventListener('click',()=>{$('ok').hidden=false;});
$('again').addEventListener('click',play);
$('back').addEventListener('click',back);
$('skip').addEventListener('click',()=>big&&big.skip());
})();
</script>
