name: LAGO Desktop EXE
# EXE 폴더가 바뀌어 main에 올라오면 Windows에서 EXE를 만들어 Release(desktop-v<버전>)에 붙여요.
on:
  push:
    branches: [main]
    paths: ["EXE/**", ".github/workflows/exe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EXE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis portable zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LAGO-Desktop
          path: |
            EXE/dist/*.exe
            EXE/dist/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.v }}
          name: LAGO Desktop ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            LAGO Desktop (Windows)
            - LAGO-Setup: 설치 파일
            - LAGO-Portable: 설치 없이 바로 실행
            - LAGO-Windows zip: 압축을 풀고 LAGO.exe 실행
            작업 폴더 · 터미널 · 코드 실행/저장은 매번 확인 창에서 허락한 뒤에만 동작해요.
          files: |
            EXE/dist/*.exe
            EXE/dist/*.zip
