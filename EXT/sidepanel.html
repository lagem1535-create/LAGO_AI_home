<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAGO</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="top">
  <img src="icons/32.png" width="20" height="20" alt="">
  <svg class="wm" viewBox="0 0 180 56" height="18" width="58" role="img" aria-label="LAGO"><g fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6V50H36"/><path d="M42 50L60 6L78 50"/><path d="M124.9 13.9A22 22 0 1 0 130 28H104"/><circle cx="150" cy="28" r="22"/></g></svg>
  <div class="seg" id="mode" role="group" aria-label="대화 / 코드"><button data-m="ask" aria-pressed="true">대화</button><button data-m="code" aria-pressed="false">코드</button></div>
  <span class="grow"></span>
  <button class="ib" id="bHist" title="지난 대화" aria-label="지난 대화"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  <button class="ib" id="bNew" title="새 대화" aria-label="새 대화"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="bMenu" title="계정" aria-label="계정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
</header>

<main id="chat" class="chat" aria-live="polite"></main>

<section id="login" class="login" hidden>
  <h2>LAGO에 로그인</h2>
  <p class="muted">로그인하면 모델이 답해요. 하지 않으면 위키백과 내용만 보여 드려요.</p>
  <div class="tabs"><button data-t="mail" aria-pressed="true">이메일</button><button data-t="code" aria-pressed="false">연결 코드 (Google)</button></div>
  <form id="fMail" autocomplete="on"><input id="lmail" type="email" placeholder="이메일" autocomplete="username" required><input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password" required><button class="pri" type="submit">로그인</button></form>
  <form id="fCode" hidden><input id="lcode" type="password" placeholder="연결 코드 붙여 넣기" autocomplete="off" required><button class="pri" type="submit">연결</button><p class="muted s">LAGO 사이트 → 계정 메뉴 → <b>앱 받기</b> → ‘연결 코드 복사’. 비밀번호와 같으니 남에게 보여 주지 마세요.</p></form>
  <p class="err" id="lerr" role="alert"></p>
  <button class="link" id="lskip">로그인 없이 쓰기 (위키백과만)</button>
</section>

<aside id="hist" class="drawer" hidden aria-label="지난 대화"><div class="dh"><b>지난 대화</b><span class="grow"></span><button class="ib" id="hX" aria-label="닫기"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="hlist"></div></aside>
<div id="menu" class="menu" hidden></div>

<footer class="foot">
  <div class="chips" id="chips">
    <button data-q="page">이 페이지 요약</button>
    <button data-q="sel">선택한 글 설명</button>
    <button data-q="ask">이 페이지에 질문</button>
  </div>
  <div id="att" class="att" hidden><span id="attt"></span><button class="ib" id="attx" aria-label="페이지 빼기"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <form id="f" class="box">
    <textarea id="q" rows="1" placeholder="LAGO에게 물어보세요" aria-label="질문"></textarea>
    <button class="send" id="bSend" type="submit" aria-label="보내기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <p class="note" id="note">LAGO는 실수할 수 있어요. 중요한 내용은 출처를 확인해 주세요.</p>
</footer>
<script src="sidepanel.js"></script>
</body>
</html>
